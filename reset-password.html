<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - UNIWAVE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="bg-dark">
  <div class="container py-5" style="max-width: 520px;">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="mb-3">Đặt lại mật khẩu</h3>

        <div id="state-loading" class="alert alert-info">Đang kiểm tra link...</div>
        <div id="state-invalid" class="alert alert-danger d-none">
          Link không hợp lệ hoặc đã hết hạn. Vui lòng yêu cầu link mới ở trang đăng nhập.
          <div class="mt-2">
            <a href="authentication.html" class="btn btn-outline-dark btn-sm">Quay lại đăng nhập</a>
          </div>
        </div>

        <form id="reset-form" class="d-none">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input id="email" class="form-control" type="email" readonly />
          </div>

          <div class="mb-3">
            <label class="form-label">Mật khẩu mới</label>
            <input id="newPassword" class="form-control" type="password" required />
            <div class="form-text">
              Ít nhất 8 ký tự, gồm chữ + số + ký tự đặc biệt.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Xác nhận mật khẩu</label>
            <input id="confirmPassword" class="form-control" type="password" required />
          </div>

          <button id="submitBtn" type="submit" class="btn btn-dark w-100">Đổi mật khẩu</button>

          <div id="error" class="text-danger mt-3" role="alert" aria-live="polite"></div>
          <div id="success" class="text-success mt-3" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    (function () {
      const Api = window.UniwaveAPI || window.UniwaveApi;

      const loading = document.getElementById("state-loading");
      const invalid = document.getElementById("state-invalid");
      const form = document.getElementById("reset-form");
      const emailInput = document.getElementById("email");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("error");
      const successBox = document.getElementById("success");

      const params = new URLSearchParams(window.location.search);
      const token = (params.get("token") || "").trim();
      const email = (params.get("email") || "").trim();

      const setError = (msg) => { errorBox.textContent = msg || ""; };
      const setSuccess = (msg) => { successBox.textContent = msg || ""; };

      const showInvalid = () => {
        loading.classList.add("d-none");
        invalid.classList.remove("d-none");
        form.classList.add("d-none");
      };

      const showForm = () => {
        loading.classList.add("d-none");
        invalid.classList.add("d-none");
        form.classList.remove("d-none");
      };

      const validatePasswordClient = (pwd) => {
        if (!pwd || pwd.length < 8) return "Mật khẩu phải có ít nhất 8 ký tự.";
        if (!/[A-Za-z]/.test(pwd)) return "Mật khẩu phải có ít nhất 1 chữ cái.";
        if (!/[0-9]/.test(pwd)) return "Mật khẩu phải có ít nhất 1 chữ số.";
        if (!/[^A-Za-z0-9]/.test(pwd)) return "Mật khẩu phải có ít nhất 1 ký tự đặc biệt.";
        return "";
      };

      async function init() {
        if (!Api?.apiFetch || !token || !email) {
          showInvalid();
          return;
        }

        try {
          const res = await Api.apiFetch(`api/Auth/reset-password/validate?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`, {
            method: "GET"
          });

          const data = await res.json();
          if (!data?.isValid) {
            showInvalid();
            return;
          }

          emailInput.value = email;
          showForm();
        } catch (e) {
          showInvalid();
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setError("");
        setSuccess("");

        const newPassword = newPasswordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        const pwdErr = validatePasswordClient(newPassword);
        if (pwdErr) { setError(pwdErr); return; }

        if (newPassword !== confirmPassword) {
          setError("Mật khẩu xác nhận không khớp.");
          return;
        }

        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Đang xử lý...";

        try {
          await Api.apiFetch("api/Auth/reset-password", {
            method: "POST",
            body: {
              email,
              resetToken: token,
              newPassword,
              confirmPassword,
            }
          });

          setSuccess("Đổi mật khẩu thành công. Bạn có thể đăng nhập lại.");
          setTimeout(() => window.location.href = "authentication.html", 1200);
        } catch (err) {
          setError(err?.message || "Không thể đổi mật khẩu. Vui lòng thử lại.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });

      init();
    })();
  </script>
</body>
</html>
