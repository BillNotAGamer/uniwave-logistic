<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - UNIWAVE</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: "Segoe UI Variable", "Segoe UI", "Candara", "Trebuchet MS", "Calibri", sans-serif;
      color: #0f172a;
      background: radial-gradient(1200px circle at 12% 0%, #ffffff 0%, #f2f6fb 40%, #e5edf7 100%);
    }

    .page {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 28px 60px rgba(15, 23, 42, 0.12);
      animation: cardIn 0.6s ease-out;
    }

    .card-header {
      margin-bottom: 22px;
    }

    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #64748b;
    }

    .title {
      margin: 8px 0 6px;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }

    .subtitle {
      margin: 0;
      font-size: 14px;
      color: #64748b;
      line-height: 1.5;
    }

    .state {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.5;
      animation: fadeUp 0.4s ease-out;
    }

    .state strong {
      display: block;
      margin-bottom: 4px;
    }

    .state-info {
      background: #eaf2ff;
      border-color: #c6dcff;
      color: #1e3a8a;
    }

    .state-error {
      background: #fef2f2;
      border-color: #f5c2c2;
      color: #7f1d1d;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      margin-top: 2px;
      flex-shrink: 0;
      animation: spin 0.8s linear infinite;
    }

    #reset-form {
      animation: fadeUp 0.5s ease-out;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      color: #0f172a;
      background: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    input[readonly] {
      background: #f8fafc;
      color: #475569;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      padding-right: 44px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      padding: 6px;
      font-size: 16px;
      cursor: pointer;
      color: #64748b;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .toggle-password:hover {
      color: #1f2937;
      transform: translateY(-50%) scale(1.05);
    }

    .toggle-password:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
      border-radius: 10px;
    }

    .toggle-password[aria-pressed="true"] {
      color: #0f172a;
    }

    .hint {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }

    .primary-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #0f172a;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .primary-button:hover {
      background: #1f2937;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.18);
      transform: translateY(-1px);
    }

    .primary-button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #1f2937;
      color: #1f2937;
      text-decoration: none;
      font-weight: 600;
      margin-top: 12px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .link-button:hover {
      background: #1f2937;
      color: #ffffff;
    }

    .message {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid;
      font-size: 14px;
      line-height: 1.4;
      animation: fadeUp 0.3s ease-out;
    }

    .message-error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .message-success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }

    #error:empty,
    #success:empty {
      display: none;
    }

    .d-none {
      display: none !important;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px;
      }

      .auth-card {
        padding: 24px 20px;
      }

      .title {
        font-size: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="auth-card" aria-labelledby="reset-title">
      <header class="card-header">
        <div class="brand">Uniwave</div>
        <h1 id="reset-title" class="title">Đặt lại mật khẩu</h1>
        <p class="subtitle">Tạo mật khẩu mới để tiếp tục.</p>
      </header>

      <div id="state-loading" class="state state-info" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <strong>Đang kiểm tra link...</strong>
          <p>Vui lòng chờ trong giây lát.</p>
        </div>
      </div>

      <div id="state-invalid" class="state state-error d-none" role="alert" aria-live="polite">
        <div>
          <strong>Link không hợp lệ hoặc đã hết hạn.</strong>
          <p>Vui lòng yêu cầu link mới ở trang đăng nhập.</p>
          <a href="authentication.html" class="link-button">Quay lại đăng nhập</a>
        </div>
      </div>

      <form id="reset-form" class="d-none">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" readonly aria-readonly="true" autocomplete="email" />
        </div>

        <div class="field">
          <label for="newPassword">Mật khẩu mới</label>
          <div class="input-wrap">
            <input id="newPassword" type="password" required autocomplete="new-password" aria-describedby="passwordHint" />
            <button type="button" class="toggle-password" data-target="newPassword" aria-label="Hiện mật khẩu" aria-pressed="false">👁</button>
          </div>
          <div class="hint" id="passwordHint">
            Ít nhất 8 ký tự, gồm chữ + số + ký tự đặc biệt.
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <div class="input-wrap">
            <input id="confirmPassword" type="password" required autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Hiện mật khẩu" aria-pressed="false">👁</button>
          </div>
        </div>

        <button id="submitBtn" type="submit" class="primary-button">Đổi mật khẩu</button>

        <div id="error" class="message message-error" role="alert" aria-live="polite"></div>
        <div id="success" class="message message-success" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script>
    (function () {
      const Api = window.UniwaveAPI || window.UniwaveApi;

      const loading = document.getElementById("state-loading");
      const invalid = document.getElementById("state-invalid");
      const form = document.getElementById("reset-form");
      const emailInput = document.getElementById("email");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const submitBtn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("error");
      const successBox = document.getElementById("success");

      const params = new URLSearchParams(window.location.search);
      const token = (params.get("token") || "").trim();
      const email = (params.get("email") || "").trim();

      const setError = (msg) => { errorBox.textContent = msg || ""; };
      const setSuccess = (msg) => { successBox.textContent = msg || ""; };

      const showInvalid = () => {
        loading.classList.add("d-none");
        invalid.classList.remove("d-none");
        form.classList.add("d-none");
      };

      const showForm = () => {
        loading.classList.add("d-none");
        invalid.classList.add("d-none");
        form.classList.remove("d-none");
      };

      const validatePasswordClient = (pwd) => {
        if (!pwd || pwd.length < 8) return "Mật khẩu phải có ít nhất 8 ký tự.";
        if (!/[A-Za-z]/.test(pwd)) return "Mật khẩu phải có ít nhất 1 chữ cái.";
        if (!/[0-9]/.test(pwd)) return "Mật khẩu phải có ít nhất 1 chữ số.";
        if (!/[^A-Za-z0-9]/.test(pwd)) return "Mật khẩu phải có ít nhất 1 ký tự đặc biệt.";
        return "";
      };

      const togglePasswordVisibility = (button) => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        if (!input) return;

        const isVisible = input.type === "text";
        input.type = isVisible ? "password" : "text";
        button.setAttribute("aria-pressed", String(!isVisible));
        button.setAttribute("aria-label", isVisible ? "Hiện mật khẩu" : "Ẩn mật khẩu");
        button.textContent = isVisible ? "👁" : "🙈";
      };

      document.querySelectorAll(".toggle-password").forEach((button) => {
        button.addEventListener("click", () => togglePasswordVisibility(button));
      });

      async function init() {
        if (!Api?.apiFetch || !token || !email) {
          showInvalid();
          return;
        }

        try {
          const res = await Api.apiFetch(`api/Auth/reset-password/validate?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`, {
            method: "GET"
          });

          const data = await res.json();
          if (!data?.isValid) {
            showInvalid();
            return;
          }

          emailInput.value = email;
          showForm();
        } catch (e) {
          showInvalid();
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setError("");
        setSuccess("");

        const newPassword = newPasswordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        const pwdErr = validatePasswordClient(newPassword);
        if (pwdErr) { setError(pwdErr); return; }

        if (newPassword !== confirmPassword) {
          setError("Mật khẩu xác nhận không khớp.");
          return;
        }

        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Đang xử lý...";

        try {
          await Api.apiFetch("api/Auth/reset-password", {
            method: "POST",
            body: {
              email,
              resetToken: token,
              newPassword,
              confirmPassword,
            }
          });

          setSuccess("Đổi mật khẩu thành công. Bạn có thể đăng nhập lại.");
          setTimeout(() => window.location.href = "authentication.html", 1200);
        } catch (err) {
          setError(err?.message || "Không thể đổi mật khẩu. Vui lòng thử lại.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });

      init();
    })();
  </script>
</body>
</html>
