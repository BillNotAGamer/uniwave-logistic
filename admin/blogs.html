<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-key="title">UNIWAVE LOGISTICS</title>
    <link rel="icon" href="./image/favicon/uniwave-favicon.png" type="image/png" />
    <link rel="shortcut icon" href="../image/favicon/uniwave-favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="../css/admin.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>
<div class="layout-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="index.html" class="sidebar-logo">
            <img src="../image/general/img/Uniwave-Logo-on-Cream.png" alt="Uniwave Logo" height="30">
        </a>
    </div>
    <ul class="sidebar-nav mt-2">
      <li>
        <a href="index.html">
          <i class="bi bi-speedometer2"></i><span>Tổng quan</span>
        </a>
      </li>
      <li>
        <a href="blogs.html" class="active">
          <i class="bi bi-journal-text"></i><span>Quản lí Blog</span>
        </a>
      </li>
      <li>
        <a href="customers.html">
          <i class="bi bi-people"></i><span>Quản lí người dùng</span>
        </a>
      </li>
    </ul>
    <div class="sidebar-footer">
      Ac 2025 Uniwave
    </div>
  </aside>

  <div class="main-content">
    <header class="main-header">
      <div class="d-flex align-items-center gap-2">
        <div class="logo-text">
          <span>Uniwave</span> Dashboard
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-md-none" id="toggleSidebarBtn">
          <i class="bi bi-list"></i>
        </button>
        <div class="dropdown">
          <button class="btn btn-light border-0 d-flex align-items-center gap-2" type="button"
                  data-bs-toggle="dropdown">
            <i class="bi bi-person-circle fs-5"></i>
            <span class="d-none d-sm-inline">Admin</span>
            <i class="bi bi-caret-down-fill small d-none d-sm-inline"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Hồ sơ Admin</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#">Đăng xuất</a></li>
          </ul>
        </div>
      </div>
    </header>

    <main class="content-wrapper">
      <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-2 mb-3">
        <h5 class="mb-0">Danh sách Blog</h5>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <div class="input-group input-group-sm" style="max-width: 260px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" placeholder="Search by title" id="blogSearchInput"
                   aria-label="Search blog title">
          </div>
          <a href="blog-create.html" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-circle"></i> Bài viết mới
          </a>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0 align-middle" id="blogTable">
              <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Status</th>
                <th>CreatedAt</th>
                <th>PublishedAt</th>
                <th>Author</th>
                <th class="text-end">Actions</th>
              </tr>
              </thead>
              <tbody id="blogTableBody">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">Loading...</td>
              </tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex align-items-center justify-content-between px-3 py-2 border-top" id="blogPagination" style="display:none;">
            <div class="text-muted small" id="blogPaginationInfo"></div>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-secondary" type="button" id="blogPrevPage">Previous</button>
              <button class="btn btn-outline-secondary" type="button" id="blogNextPage">Next</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin.js"></script>
<script defer type="text/javascript" src="../js/api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const apiClient = window.UniwaveApi || window.UniwaveAPI;
    const tableBody = document.getElementById("blogTableBody");
    const searchInput = document.getElementById("blogSearchInput");
    const pagination = document.getElementById("blogPagination");
    const paginationInfo = document.getElementById("blogPaginationInfo");
    const prevBtn = document.getElementById("blogPrevPage");
    const nextBtn = document.getElementById("blogNextPage");
    const PAGE_SIZE = 20;
    const COLUMN_COUNT = 7;
    let currentPage = 1;
    let totalPages = 1;
    let currentSearch = "";
    let hasTotalHeader = false;
    let searchTimer;

    if (!tableBody) {
      console.error("Blog table not found.");
      return;
    }

    if (!apiClient || typeof apiClient.apiFetch !== "function") {
      setTableMessage("API client is not available.");
      return;
    }

    function setTableMessage(message) {
      tableBody.innerHTML = `<tr><td colspan="${COLUMN_COUNT}" class="text-center text-muted py-4">${message}</td></tr>`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
      if (!value) return "N/A";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "N/A";
      return date.toLocaleString("vi-VN");
    }

    function renderRows(items) {
      if (!items || items.length === 0) {
        setTableMessage("No blogs found.");
        return;
      }

      const fragment = document.createDocumentFragment();

      items.forEach((blog) => {
        const id = blog.id ?? "";
        const encodedId = id === "" ? "" : encodeURIComponent(id);
        const statusText = blog.status || "Unknown";
        const normalizedStatus = statusText.toString().toLowerCase();
        const isPublished = normalizedStatus === "published";
        const badgeClass = isPublished
          ? "badge bg-success-subtle text-success border border-success-subtle"
          : "badge bg-secondary-subtle text-secondary border border-secondary-subtle";

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${escapeHtml(id)}</td>
          <td>${escapeHtml(blog.title || "")}</td>
          <td><span class="${badgeClass}">${escapeHtml(statusText)}</span></td>
          <td>${formatDate(blog.createdAt)}</td>
          <td>${formatDate(blog.publishedAt)}</td>
          <td>${escapeHtml(blog.author || blog.authorName || "")}</td>
          <td class="text-end">
            <div class="btn-group btn-group-sm" role="group">
              <a class="btn btn-outline-primary" href="blog-detail.html?id=${encodedId}">View</a>
              <a class="btn btn-outline-secondary" href="blog-edit.html?id=${encodedId}">Edit</a>
              <button class="btn btn-outline-danger" type="button" data-delete-id="${escapeHtml(id)}">Delete</button>
            </div>
          </td>
        `;
        fragment.appendChild(row);
      });

      tableBody.innerHTML = "";
      tableBody.appendChild(fragment);
    }

    function renderPagination(totalCount) {
      if (!hasTotalHeader) {
        pagination.style.display = "none";
        return;
      }

      totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));

      if (totalPages <= 1) {
        pagination.style.display = "none";
        return;
      }

      pagination.style.display = "flex";
      paginationInfo.textContent = `Page ${currentPage} of ${totalPages}`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    async function loadBlogs(page = 1) {
      const query = new URLSearchParams({
        page: page.toString(),
        pageSize: PAGE_SIZE.toString()
      });
      if (currentSearch.trim()) {
        query.set("search", currentSearch.trim());
      }

      setTableMessage("Loading...");

      try {
        const response = await apiClient.apiFetch(`/api/admin/blogs?${query.toString()}`);
        const blogs = await response.json();
        const totalHeader = response.headers.get("X-Total-Count");

        hasTotalHeader = totalHeader !== null;
        const totalCount = hasTotalHeader ? Number(totalHeader) || 0 : blogs.length;

        if (Array.isArray(blogs) && blogs.length === 0 && page > 1 && hasTotalHeader && (page - 1) * PAGE_SIZE >= totalCount) {
          currentPage = page - 1;
          await loadBlogs(currentPage);
          return;
        }

        currentPage = page;
        renderRows(Array.isArray(blogs) ? blogs : []);
        renderPagination(totalCount);
      } catch (error) {
        setTableMessage(error.message || "Failed to load blogs.");
      }
    }

    async function handleDelete(blogId) {
      if (!blogId) return;
      if (!confirm("Are you sure you want to delete this blog post?")) return;

      try {
        await apiClient.apiFetch(`/api/admin/blogs/${encodeURIComponent(blogId)}`, { method: "DELETE" });
        await loadBlogs(currentPage);
      } catch (error) {
        alert(error.message || "Failed to delete the blog post.");
      }
    }

    tableBody.addEventListener("click", (event) => {
      const deleteBtn = event.target.closest("[data-delete-id]");
      if (deleteBtn) {
        handleDelete(deleteBtn.getAttribute("data-delete-id"));
      }
    });

    prevBtn?.addEventListener("click", () => {
      if (currentPage > 1) {
        loadBlogs(currentPage - 1);
      }
    });

    nextBtn?.addEventListener("click", () => {
      if (currentPage < totalPages) {
        loadBlogs(currentPage + 1);
      }
    });

    if (searchInput) {
      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          currentSearch = searchInput.value || "";
          loadBlogs(1);
        }, 300);
      });
    }

    loadBlogs();
  });
</script>
</body>
</html>
