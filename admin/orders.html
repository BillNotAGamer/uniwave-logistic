<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-key="title">UNIWAVE LOGISTICS</title>
  <link rel="icon" href="./image/favicon/uniwave-favicon.png" type="image/png" />
  <link rel="shortcut icon" href="../image/favicon/uniwave-favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="../css/admin.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div class="layout-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="sidebar-logo">
        <img src="../image/general/img/Uniwave-Logo-on-Cream.png" alt="Uniwave Logo" height="30">
      </a>
    </div>
    <ul class="sidebar-nav mt-2">
      <li><a href="index.html"><i class="bi bi-speedometer2"></i><span>Tong quan</span></a></li>
      <li><a href="blogs.html"><i class="bi bi-journal-text"></i><span>Quan ly Blog</span></a></li>
      <li><a href="customers.html"><i class="bi bi-people"></i><span>Quan ly nguoi dung</span></a></li>
      <li><a href="orders.html" class="active"><i class="bi bi-truck"></i><span>Don hang</span></a></li>
    </ul>
    <div class="sidebar-footer">Ac 2025 Uniwave</div>
  </aside>

  <div class="main-content">
    <header class="main-header">
      <div class="d-flex align-items-center gap-2">
        <div class="logo-text"><span>Uniwave</span> Dashboard</div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-md-none" id="toggleSidebarBtn">
          <i class="bi bi-list"></i>
        </button>
        <div class="dropdown">
          <button class="btn btn-light border-0 d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-person-circle fs-5"></i>
            <span class="d-none d-sm-inline">Admin</span>
            <i class="bi bi-caret-down-fill small d-none d-sm-inline"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Ho so Admin</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#">Dang xuat</a></li>
          </ul>
        </div>
      </div>
    </header>

    <main class="content-wrapper">
      <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-2 mb-3">
        <div class="d-flex flex-column">
          <h5 class="mb-0">Danh sach don hang</h5>
          <small class="text-muted">Admin xem tat ca don hang noi dia</small>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <div class="input-group input-group-sm" style="max-width: 220px;">
            <span class="input-group-text"><i class="bi bi-sliders"></i></span>
            <select class="form-select" id="statusFilter" aria-label="Filter by status">
              <option value="all">All status</option>
              <option value="Created">Created</option>
              <option value="Preparing">Preparing</option>
              <option value="InTransit">InTransit</option>
              <option value="AtLocalWarehouse">AtLocalWarehouse</option>
              <option value="OutForDelivery">OutForDelivery</option>
              <option value="Delivered">Delivered</option>
              <option value="DeliveryFailed">DeliveryFailed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <button class="btn btn-outline-secondary btn-sm" id="sortCreatedBtn">
            <i class="bi bi-sort-down-alt"></i> Sort: Newest
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table mb-0 align-middle" id="ordersTable">
              <thead>
              <tr>
                <th>Order Code</th>
                <th>Created At</th>
                <th>Status</th>
                <th>Pickup</th>
                <th>Dropoff</th>
                <th>Estimated</th>
                <th>Final</th>
                <th class="text-end">Actions</th>
              </tr>
              </thead>
              <tbody id="ordersTableBody">
              <tr><td colspan="8" class="text-center text-muted py-4">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/admin.js"></script>
<script defer type="text/javascript" src="../js/api.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const Api = window.UniwaveApi || window.UniwaveAPI;
    const tbody = document.getElementById("ordersTableBody");
    const statusFilter = document.getElementById("statusFilter");
    const sortBtn = document.getElementById("sortCreatedBtn");
    const STATUS_MAP = {
      0: "Created",
      1: "Preparing",
      2: "InTransit",
      3: "AtLocalWarehouse",
      4: "OutForDelivery",
      5: "Delivered",
      6: "DeliveryFailed",
      7: "Cancelled"
    };
    const BADGE_CLASS = {
      Created: "badge bg-secondary-subtle text-secondary border border-secondary-subtle",
      Preparing: "badge bg-info-subtle text-info border border-info-subtle",
      InTransit: "badge bg-warning-subtle text-warning border border-warning-subtle",
      AtLocalWarehouse: "badge bg-primary-subtle text-primary border border-primary-subtle",
      OutForDelivery: "badge bg-primary-subtle text-primary border border-primary-subtle",
      Delivered: "badge bg-success-subtle text-success border border-success-subtle",
      DeliveryFailed: "badge bg-danger-subtle text-danger border border-danger-subtle",
      Cancelled: "badge bg-dark-subtle text-dark border border-dark-subtle"
    };
    const COLUMN_COUNT = 8;
    let ordersData = [];
    let sortDesc = true;

    if (!tbody) return;
    if (!Api || typeof Api.apiFetch !== "function") {
      setMessage("API client khong san sang.");
      return;
    }
    if (typeof Api.getAccessToken === "function" && !Api.getAccessToken()) {
      setMessage("Not authorized. Please log in as admin.");
      return;
    }

    function setMessage(text) {
      tbody.innerHTML = `<tr><td colspan="${COLUMN_COUNT}" class="text-center text-muted py-4">${text}</td></tr>`;
    }

    function toStatusLabel(value) {
      if (typeof value === "string") return value;
      return STATUS_MAP[value] || "Unknown";
    }

    function statusBadge(status) {
      const label = toStatusLabel(status);
      const cls = BADGE_CLASS[label] || BADGE_CLASS.Created;
      return `<span class="${cls}">${label}</span>`;
    }

    function formatDate(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "--";
      return d.toLocaleString("vi-VN");
    }

    function formatMoney(value) {
      if (value === null || value === undefined) return "--";
      const num = Number(value);
      if (Number.isNaN(num)) return value;
      return num.toLocaleString("vi-VN", { style: "currency", currency: "VND" });
    }

    function applyFilters() {
      const filterVal = statusFilter?.value || "all";
      let list = [...ordersData];

      if (filterVal !== "all") {
        list = list.filter((o) => toStatusLabel(o.currentStatus) === filterVal);
      }

      list.sort((a, b) => {
        const da = new Date(a.createdAt).getTime();
        const db = new Date(b.createdAt).getTime();
        return sortDesc ? db - da : da - db;
      });

      renderRows(list);
    }

    function renderRows(items) {
      if (!items.length) {
        setMessage("No orders found.");
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((order) => {
        const orderId = order.id || order.Id;
        const orderCode = order.orderCode || order.OrderCode || "";
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${orderCode || "--"}</td>
          <td>${formatDate(order.createdAt || order.CreatedAt)}</td>
          <td>${statusBadge(order.currentStatus || order.CurrentStatus)}</td>
          <td>${order.pickupAddress || order.PickupAddress || "--"}</td>
          <td>${order.dropoffAddress || order.DropoffAddress || "--"}</td>
          <td>${formatMoney(order.estimatedPrice ?? order.EstimatedPrice)}</td>
          <td>${formatMoney(order.finalPrice ?? order.FinalPrice)}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" href="order-detail.html?id=${encodeURIComponent(orderId || "")}&code=${encodeURIComponent(orderCode)}">Xem</a>
          </td>
        `;
        fragment.appendChild(tr);
      });

      tbody.innerHTML = "";
      tbody.appendChild(fragment);
    }

    async function loadOrders() {
      setMessage("Loading...");
      try {
        const res = await Api.apiFetch("/api/orders/admin");
        const data = await res.json();
        ordersData = Array.isArray(data) ? data : [];
        applyFilters();
      } catch (error) {
        if (String(error?.message || "").includes("401") || String(error?.message || "").includes("403")) {
          setMessage("Not authorized. Please log in as admin.");
        } else {
          setMessage(error?.message || "Failed to load orders.");
        }
      }
    }

    statusFilter?.addEventListener("change", applyFilters);
    sortBtn?.addEventListener("click", () => {
      sortDesc = !sortDesc;
      sortBtn.innerHTML = sortDesc
        ? '<i class="bi bi-sort-down-alt"></i> Sort: Newest'
        : '<i class="bi bi-sort-up"></i> Sort: Oldest';
      applyFilters();
    });

    loadOrders();
  });
</script>
</body>
</html>
